version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: querydesk_api
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=5000
      - ENVIRONMENT=production
      - RATE_LIMIT_PER_MINUTE=60
      - DATABASE_PATH=/app/backend/data/chatbot.db
    volumes:
      - querydesk_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - querydesk_net

  nginx:
    image: nginx:alpine
    container_name: querydesk_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - querydesk_net

volumes:
  querydesk_data:
    driver: local

networks:
  querydesk_net:
    driver: bridge
