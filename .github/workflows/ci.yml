name: QueryDesk Enterprise CI/CD

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download NLTK Datasets
        run: |
          python -c "import nltk; datasets=['punkt','punkt_tab','stopwords','wordnet','vader_lexicon','averaged_perceptron_tagger','averaged_perceptron_tagger_eng']; [nltk.download(d, quiet=True) for d in datasets]"

      - name: Initialize Database
        env:
          PYTHONPATH: .
        run: |
          python -c "import asyncio; from backend.database import DatabaseManager; from backend.config import Config; asyncio.run(DatabaseManager(Config.DATABASE_PATH).initialize())"

      - name: Run Pytest Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest -v

      - name: Verify Health Probes
        env:
          PYTHONPATH: .
        run: |
          python -c "import backend.app; print('FastAPI App and routes successfully compiled.')"

  docker-build:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t querydesk:latest .
