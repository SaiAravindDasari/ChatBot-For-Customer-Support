name: QueryDesk Enterprise CI/CD

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov anyio

      - name: Download NLTK Tokenizers & Setup Models
        run: |
          python setup.py

      - name: Run Pytest Test Suite
        run: |
          python -m pytest tests/ -v --cov=backend --cov-report=term-missing

      - name: Verify Health Probes
        run: |
          python -c "import backend.app; print('FastAPI App and routes successfully compiled.')"

  docker-build:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t querydesk:latest .
